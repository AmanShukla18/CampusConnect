services:
  # ─── Backend: Express + Socket.IO ───────────────────────────────────────────
  - type: web
    name: campusconnect-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGO_URI
        sync: false          # Set manually in Render dashboard → Environment
      - key: CLOUDINARY_CLOUD_NAME
        sync: false          # Set manually in Render dashboard → Environment
      - key: CLOUDINARY_API_KEY
        sync: false          # Set manually in Render dashboard → Environment
      - key: CLOUDINARY_API_SECRET
        sync: false          # Set manually in Render dashboard → Environment
      - key: CLOUDINARY_FOLDER
        value: campusconnect/uploads
    healthCheckPath: /api/health

  # ─── Frontend: Expo Web (static build) ───────────────────────────────────────
  - type: web
    name: campusconnect-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: .
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://campusconnect-backend.onrender.com/api
      - key: EXPO_PUBLIC_SOCKET_URL
        value: https://campusconnect-backend.onrender.com
      - key: EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: EXPO_PUBLIC_CLOUDINARY_API_KEY
        sync: false
      - key: EXPO_PUBLIC_CLOUDINARY_API_SECRET
        sync: false
      - key: EXPO_PUBLIC_CLOUDINARY_FOLDER
        value: campusconnect/uploads/
      - key: EXPO_PUBLIC_CLOUDINARY_UPLOAD_PRESET
        value: CampusConnect
